site_name: Manuel Ethos
docs_dir: docs

# Repo link in the header + per-page "Edit this page" button. Each language is
# served from docs/<locale>/ (a link to its real source folder), so the raw
# edit_url would point at a path that doesn't exist - forge/mkdocs_hooks.py
# rewrites it to the real file, and drops it for generated languages (English).
repo_url: https://github.com/FrSkyRC/ethos-manual
repo_name: FrSkyRC/ethos-manual
edit_uri: edit/26.1/
hooks:
  - forge/mkdocs_hooks.py
# The 4 blocks below, each between a "GENERATED:" marker pair, are rewritten
# by forge/mkdocs.py from its LANGUAGES table + whichever of those already
# have a docs/<locale> set up (i.e. have a SUMMARY.md) - re-run it after
# adding/removing a language, rather than hand-editing these blocks (they'll
# just get overwritten). Everything else in this file is untouched.
extra_css:
  - extra.css
exclude_docs: |
  # BEGIN GENERATED: EXCLUDE_DOCS
  fr/forge/
  fr/SUMMARY.md
  fr/SUMMARY.nav.md
  en/forge/
  en/SUMMARY.md
  en/SUMMARY.nav.md
  # END GENERATED: EXCLUDE_DOCS

# Top-level entries here must be named after their locale, capitalized
# (Fr, En - not "Français"/"English") for plugins.i18n's own nav filtering
# to recognize and strip them, see below. literate-nav reads each
# directory's own SUMMARY.nav.md - re-run forge/mkdocs.py after editing one.
nav:
  # BEGIN GENERATED: NAV
  - Fr: fr/
  - En: en/
  # END GENERATED: NAV

theme:
  name: material
  custom_dir: overrides
  # forge/mkdocs.py copies forge/favicon.ico + forge/logo.png into docs/.
  favicon: favicon.ico
  logo: logo.png
  # primary/accent "custom" -> the near-black header + brand green from
  # forge/extra.css ([data-md-color-primary="custom"] etc.).
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  # Builds fr/ and en/ as one site with a language switcher (auto-generated
  # in the header, no manual extra.alternate needed) while keeping each
  # page's sidebar nav to just its own language - reconfigure_navigation
  # (in the plugin) strips the Fr:/En: wrapper above once resolved by
  # literate-nav. docs_structure: folder requires each top-level folder
  # name to literally be the locale code, hence docs/fr + docs/en (see
  # forge/mkdocs.py's LANGUAGES table) rather than docs/french + docs/english.
  #
  # fallback_to_default: false is required - true (its default) makes the
  # plugin mis-resolve some of our plain relative links (e.g.
  # "../model-setup/telemetry.md" from a French page) against the *other*
  # language's file instead of its own sibling. We don't want cross-
  # language fallback anyway (a missing French page should 404, not
  # silently show the English one).
  - i18n:
      docs_structure: folder
      fallback_to_default: false
      languages:
        # BEGIN GENERATED: LANGUAGES
        - locale: fr
          name: Français
          build: true
          site_name: Manuel Ethos
          site_description: Documentation utilisateur de l'OS Ethos (FrSky)
        - locale: en
          name: English
          build: true
          default: true
          site_name: Ethos Manual
          site_description: Ethos OS user documentation (FrSky)
        # END GENERATED: LANGUAGES
  - literate-nav:
      # Generated from SUMMARY.md by forge/mkdocs.py - re-run it after
      # editing SUMMARY.md. See that script's docstring for why.
      nav_file: SUMMARY.nav.md
  - section-index

extra_css:
  - extra.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
